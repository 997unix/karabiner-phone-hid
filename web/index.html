<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Phone HID</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:system-ui;background:#1a1a2e;color:#e6e6e6;display:flex;flex-direction:column}

/* Tab strip */
.tabs{display:flex;border-bottom:1px solid #333;flex-shrink:0}
.tabs button{flex:1;background:none;border:none;color:#888;font-size:13px;font-weight:600;
  padding:10px 0 8px;cursor:pointer;border-bottom:2px solid transparent;
  -webkit-tap-highlight-color:transparent}
.tabs button.active{color:#e6e6e6;border-bottom-color:#4ecca3}

/* Swipe container */
.swipe{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.swipe::-webkit-scrollbar{display:none}

/* Each page */
.page{min-width:100%;scroll-snap-align:start;display:flex;flex-direction:column;
  justify-content:flex-end;padding:12px;gap:8px}

/* Button grid inside each page */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

button.btn{border:none;border-radius:16px;color:#e6e6e6;font-size:15px;font-weight:600;
  min-height:70px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.btn:active{opacity:0.7;transform:scale(0.95)}

/* Status bar */
#status{padding:8px 16px;text-align:center;font-size:13px;flex-shrink:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:6px;vertical-align:middle}
.connected .dot{background:#4ecca3}
.disconnected .dot{background:#e74c3c}
</style>
</head><body>

<div class="tabs" id="tabs">
  <button data-idx="0" class="active">Teammate</button>
  <button data-idx="1">Terminal</button>
  <button data-idx="2">YouTube</button>
  <button data-idx="3">Keyboard</button>
  <button data-idx="4">Numpad</button>
</div>

<div class="swipe" id="swipe">
  <!-- Teammate -->
  <div class="page"><div class="grid" id="tab0"></div></div>
  <!-- Terminal -->
  <div class="page"><div class="grid" id="tab1"></div></div>
  <!-- YouTube Remote -->
  <div class="page"><div class="grid" id="tab2"></div></div>
  <!-- Keyboard -->
  <div class="page"><div class="grid" id="tab3"></div></div>
  <!-- Numpad -->
  <div class="page"><div class="grid" id="tab4"></div></div>
</div>

<div id="status" class="disconnected"><span class="dot"></span><span id="stxt">Disconnected</span></div>

<script>
const tabs = [
  { name:"Teammate", buttons:[
    {action:"superwhisper_toggle",label:"SuperWhisper",color:"#e74c3c",long:"superwhisper_paste",span:3},
    {action:"return",label:"Return",color:"#3498db"},
    {action:"teammate_accept",label:"Accept",color:"#27ae60"},
    {action:"tmux_copy_mode",label:"Copy Mode",color:"#2ecc71"},
    {action:"paste",label:"Paste",color:"#9b59b6"},
    {action:"teammate_reject",label:"Reject",color:"#c0392b"},
    {action:"tmux_page_up",label:"Pg Up",color:"#16a085"},
    {action:"teammate_attention",label:"tmate-attn",color:"#e67e22"},
    {action:"arrow_up",label:"Up",color:"#1abc9c"},
    {action:"tmux_page_down",label:"Pg Dn",color:"#16a085"},
    {action:"arrow_left",label:"Left",color:"#1abc9c"},
    {action:"arrow_down",label:"Down",color:"#1abc9c"},
    {action:"tmux_exit_copy",label:"Exit Copy",color:"#e67e22"},
    {action:null,label:"",color:"transparent"},
    {action:"arrow_right",label:"Right",color:"#1abc9c"},
  ]},
  { name:"Terminal", buttons:[
    {action:"superwhisper_toggle",label:"SW",color:"#e74c3c",long:"superwhisper_paste"},
    {action:"return",label:"Return",color:"#3498db"},
    {action:"tmux_prefix",label:"Prefix",color:"#9b59b6"},
    {action:"tmux_copy_mode",label:"Copy Mode",color:"#2ecc71"},
    {action:"tmux_scroll_up",label:"Scr Up",color:"#1abc9c"},
    {action:"tmux_scroll_down",label:"Scr Dn",color:"#1abc9c"},
    {action:"tmux_page_up",label:"Pg Up",color:"#16a085"},
    {action:"tmux_page_down",label:"Pg Dn",color:"#16a085"},
    {action:"tmux_exit_copy",label:"Exit Copy",color:"#e67e22"},
    {action:"tmux_split_h",label:"Split H",color:"#8e44ad"},
    {action:"tmux_split_v",label:"Split V",color:"#8e44ad"},
    {action:"tmux_next_pane",label:"Next Pane",color:"#2980b9"},
  ]},
  { name:"YouTube", buttons:[
    {action:"yt_prev_video",label:"Prev Vid",color:"#8e44ad"},
    {action:"yt_play_pause",label:"Play/Pause",color:"#c0392b",span:1},
    {action:"yt_next_video",label:"Next Vid",color:"#8e44ad"},
    {action:"yt_back_10",label:"\u25C0 10s",color:"#2980b9"},
    {action:"yt_mute",label:"Mute",color:"#e67e22"},
    {action:"yt_fwd_10",label:"10s \u25B6",color:"#2980b9"},
    {action:"yt_vol_down",label:"Vol -",color:"#16a085"},
    {action:"yt_fullscreen",label:"Fullscreen",color:"#27ae60"},
    {action:"yt_vol_up",label:"Vol +",color:"#16a085"},
    {action:"yt_speed_down",label:"Speed -",color:"#1abc9c"},
    {action:"yt_captions",label:"CC",color:"#e67e22"},
    {action:"yt_speed_up",label:"Speed +",color:"#1abc9c"},
  ]},
  { name:"Keyboard", buttons:[
    {action:"key_escape",label:"Esc",color:"#555"},
    {action:"key_grave",label:"`",color:"#444"},
    {action:"key_backspace",label:"Bksp",color:"#555"},
    {action:"key_tab",label:"Tab",color:"#555"},
    {action:"key_open_bracket",label:"[",color:"#444"},
    {action:"key_close_bracket",label:"]",color:"#444"},
    {action:"key_q",label:"Q",color:"#333"},{action:"key_w",label:"W",color:"#333"},{action:"key_e",label:"E",color:"#333"},
    {action:"key_r",label:"R",color:"#333"},{action:"key_t",label:"T",color:"#333"},{action:"key_y",label:"Y",color:"#333"},
    {action:"key_u",label:"U",color:"#333"},{action:"key_i",label:"I",color:"#333"},{action:"key_o",label:"O",color:"#333"},
    {action:"key_p",label:"P",color:"#333"},{action:"key_hyphen",label:"-",color:"#444"},{action:"key_equal",label:"=",color:"#444"},
    {action:"key_a",label:"A",color:"#333"},{action:"key_s",label:"S",color:"#333"},{action:"key_d",label:"D",color:"#333"},
    {action:"key_f",label:"F",color:"#333"},{action:"key_g",label:"G",color:"#333"},{action:"key_h",label:"H",color:"#333"},
    {action:"key_j",label:"J",color:"#333"},{action:"key_k",label:"K",color:"#333"},{action:"key_l",label:"L",color:"#333"},
    {action:"key_semicolon",label:";",color:"#444"},{action:"key_quote",label:"'",color:"#444"},{action:"key_backslash",label:"\\",color:"#444"},
    {action:"key_z",label:"Z",color:"#333"},{action:"key_x",label:"X",color:"#333"},{action:"key_c",label:"C",color:"#333"},
    {action:"key_v",label:"V",color:"#333"},{action:"key_b",label:"B",color:"#333"},{action:"key_n",label:"N",color:"#333"},
    {action:"key_m",label:"M",color:"#333"},{action:"key_comma",label:",",color:"#444"},{action:"key_period",label:".",color:"#444"},
    {action:"key_slash",label:"/",color:"#444"},{action:"key_space",label:"Space",color:"#555",span:2},
    {action:"key_enter",label:"Enter",color:"#27ae60"},
    {action:"arrow_left",label:"\u25C0",color:"#1abc9c"},
    {action:"arrow_down",label:"\u25BC",color:"#1abc9c"},
    {action:"arrow_up",label:"\u25B2",color:"#1abc9c"},
    {action:"arrow_right",label:"\u25B6",color:"#1abc9c"},
    {action:"key_delete",label:"Del",color:"#555"},
  ]},
  { name:"Numpad", buttons:[
    {action:"key_escape",label:"Esc",color:"#555"},
    {action:"key_backspace",label:"Bksp",color:"#555"},
    {action:"key_delete",label:"Del",color:"#555"},
    {action:"key_7",label:"7",color:"#333"},
    {action:"key_8",label:"8",color:"#333"},
    {action:"key_9",label:"9",color:"#333"},
    {action:"key_4",label:"4",color:"#333"},
    {action:"key_5",label:"5",color:"#333"},
    {action:"key_6",label:"6",color:"#333"},
    {action:"key_1",label:"1",color:"#333"},
    {action:"key_2",label:"2",color:"#333"},
    {action:"key_3",label:"3",color:"#333"},
    {action:"key_0",label:"0",color:"#333",span:2},
    {action:"key_period",label:".",color:"#444"},
    {action:"key_enter",label:"Enter",color:"#27ae60",span:3},
  ]},
];

let ws;
const swipe=document.getElementById("swipe");
const stxt=document.getElementById("stxt");
const sbar=document.getElementById("status");
const tabBtns=document.querySelectorAll(".tabs button");

// Build button grids
tabs.forEach((tab,i)=>{
  const grid=document.getElementById("tab"+i);
  tab.buttons.forEach(b=>{
    const el=document.createElement("button");
    el.className="btn";
    el.textContent=b.label;
    el.style.background=b.color;
    if(b.span)el.style.gridColumn="span "+b.span;
    if(!b.action){el.disabled=true;el.style.visibility="hidden";grid.appendChild(el);return}
    el.onclick=()=>send(b.action);
    if(b.long){
      let t;
      el.ontouchstart=(e)=>{e.preventDefault();t=setTimeout(()=>{send(b.long);if(navigator.vibrate)navigator.vibrate(50)},500)};
      el.ontouchend=()=>{clearTimeout(t);send(b.action);if(navigator.vibrate)navigator.vibrate(30)};
      el.ontouchcancel=()=>clearTimeout(t);
    }
    grid.appendChild(el);
  });
});

// Tab sync: scroll → highlight
swipe.addEventListener("scroll",()=>{
  const idx=Math.round(swipe.scrollLeft/swipe.clientWidth);
  tabBtns.forEach((b,i)=>b.classList.toggle("active",i===idx));
});

// Tab tap → scroll
tabBtns.forEach(b=>b.addEventListener("click",()=>{
  const idx=parseInt(b.dataset.idx);
  swipe.scrollTo({left:idx*swipe.clientWidth,behavior:"smooth"});
}));

function connect(){
  const host=location.hostname||"127.0.0.1";
  ws=new WebSocket("ws://"+host+":8765/ws");
  ws.onopen=()=>{sbar.className="connected";stxt.textContent="Connected"};
  ws.onclose=()=>{sbar.className="disconnected";stxt.textContent="Reconnecting...";setTimeout(connect,2000)};
  ws.onmessage=(e)=>{
    try{const m=JSON.parse(e.data);if(m.type==="config"&&m.payload&&m.payload.actions){/* could update buttons */}}catch{}
  };
}

function send(action){
  if(ws&&ws.readyState===1){
    ws.send(JSON.stringify({type:"action",id:Date.now().toString(),action,payload:{}}));
    if(navigator.vibrate)navigator.vibrate(30);
  }
}

connect();
</script>
</body></html>
