<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Phone HID</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:system-ui;background:#1a1a2e;color:#e6e6e6;display:flex;flex-direction:column}

/* Tab strip */
.tabs{display:flex;border-bottom:1px solid #333;flex-shrink:0}
.tabs button{flex:1;background:none;border:none;color:#888;font-size:13px;font-weight:600;
  padding:10px 0 8px;cursor:pointer;border-bottom:2px solid transparent;
  -webkit-tap-highlight-color:transparent}
.tabs button.active{color:#e6e6e6;border-bottom-color:#4ecca3}

/* Swipe container */
.swipe{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.swipe::-webkit-scrollbar{display:none}

/* Each page */
.page{min-width:100%;scroll-snap-align:start;display:flex;flex-direction:column;
  justify-content:flex-end;padding:12px;gap:8px}

/* Button grid inside each page */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

button.btn{border:none;border-radius:16px;color:#e6e6e6;font-size:15px;font-weight:600;
  min-height:70px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.btn:active{opacity:0.7;transform:scale(0.95)}

/* Compact keyboard layout */
.kb-page{min-width:100%;scroll-snap-align:start;display:flex;flex-direction:column;
  padding:6px;gap:0;justify-content:flex-end}
.kb-sw{border:none;border-radius:12px;color:#e6e6e6;font-size:16px;font-weight:700;
  cursor:pointer;-webkit-tap-highlight-color:transparent;background:#e74c3c;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;flex:1;max-height:12.5vh;min-height:44px;
  margin-bottom:6px}
.kb-sw:active{opacity:0.7;transform:scale(0.97)}
.kb{display:flex;flex-direction:column;gap:3px;align-items:center;flex-shrink:0}
.kb .kb-row{display:flex;gap:2px;justify-content:center;width:100%}
.kb button.key{border:none;border-radius:6px;color:#e6e6e6;font-size:11px;font-weight:600;
  height:36px;min-width:0;flex:1;cursor:pointer;-webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;justify-content:center;padding:0}
.kb button.key:active{opacity:0.7;transform:scale(0.93)}
.kb button.key.wide{flex:1.4}
.kb button.key.wider{flex:1.8}
.kb button.key.space{flex:4}
.kb button.key.fk{height:28px;font-size:9px}
/* Arrow cluster: 3-col grid for inverted-T */
.kb .arrow-cluster{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;width:auto}
.kb .arrow-cluster button.key{height:30px;width:32px;flex:none}

/* Numpad grid layout */
.np{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 8px;flex-shrink:0}
.np button.nk{border:none;border-radius:10px;color:#e6e6e6;font-size:18px;font-weight:600;
  min-height:56px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;justify-content:center}
.np button.nk:active{opacity:0.7;transform:scale(0.95)}
/* Control pad: 3-col block above numpad, double gutter between rows */
.cp{display:grid;grid-template-columns:repeat(3,1fr);column-gap:4px;row-gap:12px;padding:0 8px;flex-shrink:0;
  margin-bottom:12px}
.cp button.nk{border:none;border-radius:10px;color:#e6e6e6;font-size:14px;font-weight:600;
  min-height:50px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;justify-content:center}
.cp button.nk:active{opacity:0.7;transform:scale(0.95)}

/* Status bar */
#status{padding:8px 16px;text-align:center;font-size:13px;flex-shrink:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:6px;vertical-align:middle}
.connected .dot{background:#4ecca3}
.disconnected .dot{background:#e74c3c}
</style>
</head><body>

<div class="tabs" id="tabs">
  <button data-idx="0" class="active">tmate/tmux</button>
  <button data-idx="1">Terminal</button>
  <button data-idx="2">YouTube</button>
  <button data-idx="3">Keyboard</button>
  <button data-idx="4">Numpad</button>
</div>

<div class="swipe" id="swipe">
  <!-- Teammate -->
  <div class="page"><div class="grid" id="tab0"></div></div>
  <!-- Terminal -->
  <div class="page"><div class="grid" id="tab1"></div></div>
  <!-- YouTube Remote -->
  <div class="page"><div class="grid" id="tab2"></div></div>
  <!-- Keyboard -->
  <div class="kb-page" id="tab3"></div>
  <!-- Numpad -->
  <div class="kb-page" id="tab4"></div>
</div>

<div id="status" class="disconnected"><span class="dot"></span><span id="stxt">Disconnected</span></div>

let ws;
const swipe=document.getElementById("swipe");
const stxt=document.getElementById("stxt");
const sbar=document.getElementById("status");
const tabBtns=document.querySelectorAll(".tabs button");

// Sticky modifier state
const mods={shift:false,control:false,option:false,command:false};
const modBtns=[];// elements to update visually

function toggleMod(name){
  mods[name]=!mods[name];
  modBtns.forEach(({el,mod})=>{
    if(mod===name)el.style.opacity=mods[name]?"1":"0.6";
  });
}

function clearMods(){
  for(const k in mods)mods[k]=false;
  modBtns.forEach(({el})=>el.style.opacity="0.6");
}

function activeModList(){
  const a=[];
  for(const k in mods)if(mods[k])a.push(k);
  return a;
}

function hasActiveMods(){return activeModList().length>0}

// Send a key with current sticky modifiers, then clear them
function sendKey(action,b){
  if(hasActiveMods()&&b&&b.hid){
    // Send as keypress with modifiers
    sendKeypress(b.hid,activeModList());
    clearMods();
  } else {
    send(action);
  }
}

function sendKeypress(key,modifiers){
  if(ws&&ws.readyState===1){
    ws.send(JSON.stringify({type:"action",id:Date.now().toString(),action:"keypress",payload:{key,modifiers}}));
    if(navigator.vibrate)navigator.vibrate(30);
  }
}

// Key repeat support
function addRepeat(el,fn){
  let iv,to;
  const start=(e)=>{e.preventDefault();fn();to=setTimeout(()=>{iv=setInterval(fn,80)},400)};
  const stop=()=>{clearTimeout(to);clearInterval(iv)};
  el.addEventListener("touchstart",start,{passive:false});
  el.addEventListener("touchend",stop);
  el.addEventListener("touchcancel",stop);
  el.addEventListener("mousedown",start);
  el.addEventListener("mouseup",stop);
  el.addEventListener("mouseleave",stop);
}

// Wire up a button element with action/long-press
function wireBtn(el,b){
  if(!b.action){el.disabled=true;el.style.visibility="hidden";return}
  // Modifier toggle buttons
  if(b.action.startsWith("mod_")){
    const mod=b.action.slice(4);// "mod_shift" → "shift"
    el.style.opacity="0.6";
    el.onclick=()=>{toggleMod(mod);if(navigator.vibrate)navigator.vibrate(30)};
    modBtns.push({el,mod});
    return;
  }
  // Repeating keys (arrows, backspace, delete, space)
  if(b.repeat){
    const fn=()=>sendKey(b.action,b);
    addRepeat(el,fn);
    el.onclick=null;// repeat handles it
    return;
  }
  // Long-press actions (SuperWhisper paste)
  if(b.long){
    let t;
    el.ontouchstart=(e)=>{e.preventDefault();t=setTimeout(()=>{send(b.long);if(navigator.vibrate)navigator.vibrate(50)},500)};
    el.ontouchend=()=>{clearTimeout(t);sendKey(b.action,b);if(navigator.vibrate)navigator.vibrate(30)};
    el.ontouchcancel=()=>clearTimeout(t);
    return;
  }
  // Normal key — send with modifiers if active
  el.onclick=()=>sendKey(b.action,b);
}

// Build button grids

        wireBtn(el,b);
        cpDiv.appendChild(el);
      });

    }
    // Keyboard area
    const kbDiv=document.createElement("div");
    kbDiv.className="kb";
    tab.rows.forEach(row=>{
      if(row==="gap"){
        const gap=document.createElement("div");
        gap.style.height="6px";
        kbDiv.appendChild(gap);
      } else if(row==="arrows"){

        const cl=document.createElement("div");
        cl.className="arrow-cluster";

          const el=document.createElement("button");
          el.className="key";
          el.textContent=b.label||"";
          el.style.background=b.color||"transparent";
          if(!b.action){el.style.visibility="hidden";el.disabled=true}
          else wireBtn(el,b);
          cl.appendChild(el);
        });
        const wrap=document.createElement("div");
        wrap.className="kb-row";
        wrap.style.justifyContent="center";
        wrap.appendChild(cl);
        kbDiv.appendChild(wrap);
      } else {
        const rowEl=document.createElement("div");
        rowEl.className="kb-row";
        row.forEach(b=>{
          const el=document.createElement("button");
          el.className="key"+(b.css?" "+b.css:"");

          el.style.background=b.color;
          wireBtn(el,b);
          rowEl.appendChild(el);
        });
        kbDiv.appendChild(rowEl);
      }
    });
    container.appendChild(kbDiv);
  } else if(tab.layout==="numpad"){
    // SuperWhisper banner
    if(tab.sw){
      const sw=document.createElement("button");
      sw.className="kb-sw";
      sw.textContent=tab.sw.label;
      wireBtn(sw,tab.sw);
      container.appendChild(sw);
    }
    // Control pad (Insert/Home/PgUp block)
    const cpDiv=document.createElement("div");
    cpDiv.className="cp";
    tab.controlPad.forEach(b=>{
      const el=document.createElement("button");
      el.className="nk";
      el.textContent=b.label;
      el.style.background=b.color;
      wireBtn(el,b);
      cpDiv.appendChild(el);
    });
    container.appendChild(cpDiv);
    // Numpad grid with row/col spanning
    const npDiv=document.createElement("div");
    npDiv.className="np";
    tab.numpad.forEach(b=>{

      el.style.background=b.color;
      if(b.colSpan)el.style.gridColumn="span "+b.colSpan;
      if(b.rowSpan)el.style.gridRow="span "+b.rowSpan;
      wireBtn(el,b);
      npDiv.appendChild(el);
    });
    container.appendChild(npDiv);
  } else {
    // Standard 3-column grid
    tab.buttons.forEach(b=>{
      const el=document.createElement("button");
      el.className="btn";
      el.textContent=b.label;
      el.style.background=b.color;
      if(b.span)el.style.gridColumn="span "+b.span;
      wireBtn(el,b);
      container.appendChild(el);
    });
  }
});

// Tab sync: scroll → highlight
swipe.addEventListener("scroll",()=>{
  const idx=Math.round(swipe.scrollLeft/swipe.clientWidth);
  tabBtns.forEach((b,i)=>b.classList.toggle("active",i===idx));
});

// Tab tap → scroll
tabBtns.forEach(b=>b.addEventListener("click",()=>{
  const idx=parseInt(b.dataset.idx);
  swipe.scrollTo({left:idx*swipe.clientWidth,behavior:"smooth"});
}));

function connect(){
  const host=location.hostname||"127.0.0.1";
  ws=new WebSocket("ws://"+host+":8765/ws");
  ws.onopen=()=>{sbar.className="connected";stxt.textContent="Connected"};
  ws.onclose=()=>{sbar.className="disconnected";stxt.textContent="Reconnecting...";setTimeout(connect,2000)};
  ws.onmessage=(e)=>{
    try{const m=JSON.parse(e.data);if(m.type==="config"&&m.payload&&m.payload.actions){/* could update buttons */}}catch{}
  };
}

function send(action){
  if(ws&&ws.readyState===1){
    ws.send(JSON.stringify({type:"action",id:Date.now().toString(),action,payload:{}}));
    if(navigator.vibrate)navigator.vibrate(30);
  }
}

connect();
</script>
